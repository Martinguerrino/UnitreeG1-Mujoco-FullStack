controller_manager:
  ros__parameters:
    update_rate: 500

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster
    update_rate: 100

whole_body_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: false
    action_monitor_rate: 20.0
    interpolation_method: splines
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 1.0
    gains:
      left_hip_pitch_joint: {p: 120.0, i: 0.0, d: 4.0}
      left_hip_roll_joint: {p: 120.0, i: 0.0, d: 4.0}
      left_hip_yaw_joint: {p: 100.0, i: 0.0, d: 3.0}
      left_knee_joint: {p: 180.0, i: 0.0, d: 6.0}
      left_ankle_pitch_joint: {p: 60.0, i: 0.0, d: 2.0}
      left_ankle_roll_joint: {p: 60.0, i: 0.0, d: 2.0}
      right_hip_pitch_joint: {p: 120.0, i: 0.0, d: 4.0}
      right_hip_roll_joint: {p: 120.0, i: 0.0, d: 4.0}
      right_hip_yaw_joint: {p: 100.0, i: 0.0, d: 3.0}
      right_knee_joint: {p: 180.0, i: 0.0, d: 6.0}
      right_ankle_pitch_joint: {p: 60.0, i: 0.0, d: 2.0}
      right_ankle_roll_joint: {p: 60.0, i: 0.0, d: 2.0}
      waist_yaw_joint: {p: 100.0, i: 0.0, d: 4.0}
      waist_roll_joint: {p: 100.0, i: 0.0, d: 4.0}
      waist_pitch_joint: {p: 100.0, i: 0.0, d: 4.0}
      left_shoulder_pitch_joint: {p: 40.0, i: 0.0, d: 1.5}
      left_shoulder_roll_joint: {p: 40.0, i: 0.0, d: 1.5}
      left_shoulder_yaw_joint: {p: 30.0, i: 0.0, d: 1.0}
      left_elbow_joint: {p: 35.0, i: 0.0, d: 1.2}
      left_wrist_roll_joint: {p: 12.0, i: 0.0, d: 0.4}
      left_wrist_pitch_joint: {p: 8.0, i: 0.0, d: 0.3}
      left_wrist_yaw_joint: {p: 8.0, i: 0.0, d: 0.3}
      right_shoulder_pitch_joint: {p: 40.0, i: 0.0, d: 1.5}
      right_shoulder_roll_joint: {p: 40.0, i: 0.0, d: 1.5}
      right_shoulder_yaw_joint: {p: 30.0, i: 0.0, d: 1.0}
      right_elbow_joint: {p: 35.0, i: 0.0, d: 1.2}
      right_wrist_roll_joint: {p: 12.0, i: 0.0, d: 0.4}
      right_wrist_pitch_joint: {p: 8.0, i: 0.0, d: 0.3}
      right_wrist_yaw_joint: {p: 8.0, i: 0.0, d: 0.3}

