g1_perception:
  ros__parameters:
    use_sim_time: true
    # base_link has gravity-aligned axes and its origin at floor height.
    processing_frame: base_link
    # Pick currently expresses its arm goals relative to pelvis.
    target_frame: pelvis
    segmentation_backend: yolo
    yolo.model: artifacts/perception/g1_objects_yolo11n_seg.onnx
    yolo.confidence: 0.3
    yolo.iou: 0.5
    yolo.threads: 2
    refinement.geometric_support: true
    refinement.min_mask_pixels: 12
    refinement.min_points: 8
    refinement.erosion_pixels: 1
    refinement.min_valid_fraction: 0.35
    refinement.neighbor_radius: 0.025
    refinement.support_margin: 0.025
    refinement.min_supported_fraction: 0.25
    refinement.min_component_fraction: 0.6
    refinement.box_shape_validation: true
    refinement.box_max_aspect_ratio: 6.0
    refinement.duplicate_point_fraction: 0.6
    refinement.partial_box_confidence: 0.55
    refinement.partial_box_rectangularity: 0.45
    refinement.partial_box_min_aspect: 1.3
    multiview.enabled: true
    multiview.max_views: 6
    multiview.max_points: 15000
    multiview.max_age: 4.0
    multiview.voxel_size: 0.004
    multiview.min_translation: 0.03
    multiview.min_rotation_deg: 8.0
    multiview.motion_reset: 0.08
    # Fixed frame: robot motion must not become apparent object motion.
    tracking_frame: odom
    tracking.match_distance: 0.18
    tracking.dimension_gate: 0.08
    tracking.timeout: 2.0
    tracking.alpha: 0.35
    tracking.confirmation_hits: 2
    # Stability is measured on raw observations in odom, before smoothing.
    tracking.stability_window: 2.0
    tracking.stability_min_duration: 1.0
    tracking.stability_min_samples: 3
    tracking.stability_max_gap: 0.8
    tracking.stability_position: 0.025
    tracking.stability_dimensions: 0.025
    tracking.stability_angle_deg: 12.0
    free_space.enabled: true
    free_space.cell_size: 0.025
    free_space.edge_margin: 0.04
    free_space.obstacle_margin: 0.04
    free_space.min_side: 0.08
    free_space.max_regions: 6
    free_space.max_cells: 20000
    sync.queue_size: 8
    sync.tf_wait: 0.3
    sync.poll_period: 0.02
    update_period: 0.5
    gpu.update_period: 0.2
    max_age: 0.5
    stride: 2
    min_depth: 0.2
    max_depth: 3.5
    voxel_size: 0.005
    plane_distance: 0.008
    plane_trials: 180
    min_table_points: 150
    min_table_height: 0.45
    max_table_height: 1.15
    max_table_tilt_deg: 12.0
    min_table_side: 0.25
    cluster_radius: 0.018
    min_object_points: 20
    min_object_height: 0.018
    max_object_height: 0.4
    max_object_side: 0.4
    min_top_fraction: 0.15
    min_top_rectangularity: 0.85
    max_tables: 3
