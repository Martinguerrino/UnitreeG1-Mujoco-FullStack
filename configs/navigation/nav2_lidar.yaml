# LiDAR-specific navigation: separate planning clearance from collision envelope.
nav2:
  local_costmap:
    local_costmap:
      ros__parameters:
        # Same 0.66 x 0.64 m envelope as the collision monitor. The global
        # planner retains 0.66 x 0.70 m to prefer paths with extra clearance.
        footprint: '[[-0.31, -0.30], [0.31, -0.30], [0.31, 0.30], [-0.31, 0.30]]'
        footprint_padding: 0.02
  controller_server:
    ros__parameters:
      FollowPath:
        # Walk a checked arc for moderate heading errors instead of requiring
        # an in-place turn beside a wall. Large errors still require alignment.
        rotate_to_heading_min_angle: 1.0
  collision_monitor:
    ros__parameters:
      FootprintApproach:
        # Nominal collision width is 0.55 m. Retain 4.5 cm per side here;
        # Nav2 planning keeps its wider 0.70 m padded footprint.
        points: '[[-0.33, -0.32], [0.33, -0.32], [0.33, 0.32], [-0.33, 0.32]]'
        visualize: true
