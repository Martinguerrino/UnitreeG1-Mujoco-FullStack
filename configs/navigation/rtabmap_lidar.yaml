/**:
  ros__parameters:
    use_sim_time: true
    frame_id: base_link
    map_frame_id: map
    odom_frame_id: ''
    publish_tf: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    subscribe_odom_info: false
    approx_sync: true
    approx_sync_max_interval: 0.05
    qos_scan: 2
    qos_odom: 1
    wait_for_transform: 0.3
    map_always_update: true
    cloud_output_voxelized: true
    # FAST-LIO supplies continuous odometry; only this node publishes map -> odom.
    Rtabmap/DetectionRate: '2.0'
    Reg/Strategy: '1'
    Reg/Force3DoF: 'false'
    RGBD/NeighborLinkRefining: 'false'
    RGBD/ProximityBySpace: 'true'
    RGBD/ProximityByTime: 'false'
    RGBD/ProximityMaxGraphDepth: '0'
    RGBD/ProximityPathMaxNeighbors: '1'
    RGBD/ProximityPathFilteringRadius: '2.0'
    RGBD/LocalRadius: '2.0'
    RGBD/ProximityAngle: '180'
    RGBD/ProximityOdomGuess: 'true'
    RGBD/LinearUpdate: '0.1'
    RGBD/AngularUpdate: '0.1'
    RGBD/OptimizeMaxError: '3.0'
    Mem/STMSize: '10'
    Mem/NotLinkedNodesKept: 'false'
    Icp/Strategy: '0'
    Icp/PointToPlane: 'true'
    Icp/PointToPlaneK: '20'
    Icp/VoxelSize: '0.1'
    Icp/RangeMin: '0.5'
    Icp/RangeMax: '20.0'
    Icp/Iterations: '30'
    Icp/Epsilon: '0.001'
    Icp/MaxCorrespondenceDistance: '0.35'
    Icp/CorrespondenceRatio: '0.4'
    Icp/MaxTranslation: '0.75'
    Icp/MaxRotation: '0.35'
    # The 2-D planning map is distinct from the complete XYZ reconstruction.
    Grid/Sensor: '0'
    Grid/3D: 'true'
    Grid/CellSize: '0.1'
    Grid/RangeMin: '0.5'
    Grid/RangeMax: '20.0'
    Grid/RayTracing: 'true'
    Grid/NormalsSegmentation: 'false'
    Grid/MinGroundHeight: '-0.1'
    Grid/MaxGroundHeight: '0.15'
    Grid/MaxObstacleHeight: '1.5'
    Grid/FootprintLength: '0.8'
    Grid/FootprintWidth: '0.8'
    Grid/FootprintHeight: '1.5'
    GridGlobal/FootprintRadius: '0.4'
    GridGlobal/MinSize: '20.0'
