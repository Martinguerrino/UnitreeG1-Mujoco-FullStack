# Shared by both SLAM modes. Keep physical footprint, inflation and RPP coherent.
nav2:
  controller_server:
    ros__parameters:
      FollowPath:
        rotate_to_heading_min_angle: 0.6
        cost_scaling_dist: 0.45
        cost_scaling_gain: 1.0
        inflation_cost_scaling_factor: 5.0
        regulated_linear_scaling_min_speed: 0.10
        min_approach_linear_velocity: 0.05
  local_costmap:
    local_costmap:
      ros__parameters:
        # Nominal collision geometry is about 0.55 m wide; allow gait and pose error.
        footprint: '[[-0.28, -0.30], [0.28, -0.30], [0.28, 0.30], [-0.28, 0.30]]'
        footprint_padding: 0.05
        width: 4
        height: 4
        inflation_layer:
          inflation_radius: 0.7
          cost_scaling_factor: 5.0
        voxel_layer:
          scan:
            inf_is_valid: true
            obstacle_max_range: 5.0
            raytrace_max_range: 8.0
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint: '[[-0.28, -0.30], [0.28, -0.30], [0.28, 0.30], [-0.28, 0.30]]'
        footprint_padding: 0.05
        inflation_layer:
          inflation_radius: 0.7
          cost_scaling_factor: 5.0
        obstacle_layer:
          scan:
            inf_is_valid: true
            obstacle_max_range: 5.0
            raytrace_max_range: 8.0
  collision_monitor:
    ros__parameters:
      cmd_vel_in_topic: cmd_vel_assisted
      # Both sensor odometries describe past captures; evaluate measured scan time.
      base_shift_correction: false
      FootprintApproach:
        time_before_collision: 1.0
        simulation_time_step: 0.05
        min_points: 3
turn_assist:
  enabled: true
  speed: 0.30
  period: 1.5
  acceleration: 0.6
  angular_gain: 4.0
  minimum_assist_turn_rate: 0.5
  tracking_angular_gain: 1.5
  max_angular_speed: 1.0
  angular_acceleration: 2.0
  min_angular_speed: 0.01
  release_angular_speed: 0.001
  max_linear_speed: 0.03
  max_forward_command: 0.05
  angular_linear_ratio: 0.7
  obstacle_clearance: 0.5
  # Match the padded Nav2 footprint, including diagonal obstacles during pulses.
  robot_half_length: 0.33
  robot_half_width: 0.35
  turn_obstacle_margin: 0.10
