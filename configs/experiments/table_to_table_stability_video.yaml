kind: task
robot: configs/robot_maxwell_table_start.yaml
locomotion: configs/locomotion.yaml
manipulation: configs/manipulation.yaml
camera: configs/camera_dual_stability.yaml
task:
  defaults:
    timeout: 50.0
    settle_duration: 1.0
    stop_speed_tolerance: 0.12
    max_retries: 0
  steps:
    # Leave along the clear aisle south of the workbench; a diagonal from the
    # table to the doorway intersects the desk corner.
    - skill: goto
      target: [1.0, -6.0, 3.141592653589793]
    # Approach the central doorway from the south.
    - skill: goto
      target: [1.0, -1.0, 1.5707963267948966]
    # Cross the doorway in the east-west partition at x < 2 m.
    - skill: goto
      target: [1.0, 1.0, 1.5707963267948966]
    # Continue north while remaining east of the vertical partition.
    - skill: goto
      target: [1.0, 5.5, 0.0]
    # Traverse the storage room, north of crate_stack_2.
    - skill: goto
      target: [5.5, 5.5, 0.0]
    # Stop south of storage_bench [6.5, 6.5], facing the table.
    - skill: goto
      target: [6.5, 5.9, 1.5707963267948966]
seed: 0
warmup: 2.0
stand_duration: 2.0
duration: 180.0
max_speed: 0.3
position_tolerance: 0.15
orientation_tolerance: 0.18
results_dir: videos/table_to_table_stability
