kind: task
robot: configs/robot.yaml
locomotion: configs/locomotion.yaml
manipulation: configs/manipulation.yaml
camera: configs/camera.yaml
task:
  defaults:
    timeout: 20.0
    settle_duration: 1.0
    stop_speed_tolerance: 0.1
    max_retries: 0
  steps:
    - skill: goto
      target: [0.5, 0.0, 0.0]
    - skill: goto
      target: [1.0, 0.0, 0.0]
seed: 0
warmup: 2.0
stand_duration: 2.0
duration: 45.0
max_speed: 0.3
position_tolerance: 0.12
orientation_tolerance: 0.15
results_dir: results
